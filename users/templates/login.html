{% extends 'layout.html' %}

{% block content %}

<h1>Вход</h1>

<form method="POST">
    {% csrf_token %}
    {% if form.non_field_errors %}
        <div style = 'color: red;'>{{ form.non_field_errors }}</div>
    {% endif %}

    {{ form.as_p }}
    <button type='submit'>Войти</button>

</form>

<p>Нет аккаунта? <a href="{% url 'users:register'%}">Зарегистрироваться</a></p>


{% endblock %}
