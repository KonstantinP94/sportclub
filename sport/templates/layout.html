<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportClub</title>
</head>
<body>
    <header>
        {% if messages %}
            <div style="max-width: 1200px; margin: 10px auto; padding: 0 16px;">
                {% for message in messages %}
                    <div style="padding: 12px 16px; margin-bottom: 8px; border-radius: 6px;
                        {% if message.tags == 'success' %}background: #d4edda; color: #155724; border: 1px solid #c3e6cb;
                        {% elif message.tags == 'error' %}background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;
                        {% elif message.tags == 'warning' %}background: #fff3cd; color: #856404; border: 1px solid #ffeeba;
                        {% else %}background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb;{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
                </div>
        {% endif %}
        <nav>
            <a href="{% url 'sport:home' %}">Главная</a>
            {% if user.is_authenticated %}
                <a href="{% url 'users:profile'%}">Личный кабинет</a>
                <span>{{ user.username }}</span>
                <a href="{% url 'users:logout' %}">Выйти</a>
            {% else %}
                <a href="{% url 'users:login' %}">Войти</a>
                <a href="{% url 'users:register' %}">Регистрация</a>
            {% endif %}
        </nav>
    </header>


    <main>
        {% block content %} {% endblock %}
    </main>

    <footer>
        © 2026 SportClub
    </footer>
</body>
</html>
